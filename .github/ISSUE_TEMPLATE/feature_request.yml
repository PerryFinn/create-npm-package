name: "功能需求"
description: 提出想法或改进建议
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！如果需求较复杂或影响范围较大，维护者可能会请你先发起 RFC 进行深入讨论。
  - type: textarea
    id: problem
    attributes:
      label: 目标问题
      description: 请清晰描述该功能要解决的问题。
      placeholder: 我经常遇到的问题是...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望这个模板如何改进？
      placeholder: 我希望增加/改成...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果你考虑过其他解决方案，请在这里说明。
  - type: dropdown
    id: importance
    attributes:
      label: 重要程度
      description: 这个功能对你有多重要？
      options:
        - 可有可无
        - 会明显提高效率
        - 没有它就无法使用
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 其他背景、截图或参考资料。
